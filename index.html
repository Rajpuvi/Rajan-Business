      .shop-head{background:#ede9fe!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    }

  try{
    // Store compressed logo
    if(url && url.length < 500000) localStorage.setItem("rajan_logo",url);
  }catch{}
}

/* ══════════════════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════════════════ */
function App(){
  const [view,setView]=useState("dashboard");
  const [projects,setProjects]=useState(loadData);
  const [filter,setFilter]=useState("all");
  const [showForm,setShowForm]=useState(false);
  const [editProj,setEditProj]=useState(null);
  const [docProj,setDocProj]=useState(null);
  const [docType,setDocType]=useState("quotation");
  const [logoUrl,setLogoUrl]=useState(loadLogo);
  const [showRates,setShowRates]=useState(false);
  const [alerts,setAlerts]=useState([]);
  const logoRef=useRef();

  /* persist projects */
  useEffect(()=>{saveData(projects);},[projects]);

  /* reminders */
  useEffect(()=>{
    const tod=today();
    setAlerts(projects.filter(p=>p.reminder&&p.reminder<=tod&&p.payStatus!=="paid"));
  },[projects]);

  /* render doc to print div */
  useEffect(()=>{
    const el=document.getElementById("a4print");
    if(!el) return;
    if(view==="doc"&&docProj){
      const root2=ReactDOM.createRoot?ReactDOM.createRoot(el):null;
      if(root2) root2.render(React.createElement(A4Doc,{project:docProj,type:docType,logoUrl,owner:OWNER,itemsT,shopT,grandTotal,bal}));
    } else {
      el.innerHTML="";
    }
  },[view,docProj,docType,logoUrl]);

  function itemsT(p){return p.items.reduce((a,i)=>a+i.total,0);}
  function shopT(p){return (p.shopPurchases||[]).reduce((a,i)=>a+i.total,0);}
  function grandTotal(p){return itemsT(p)+shopT(p);}
  function bal(p){return grandTotal(p)-(p.received||0);}

  const totalContract=projects.reduce((s,p)=>s+grandTotal(p),0);
  const totalReceived=projects.reduce((s,p)=>s+(p.received||0),0);
  const totalBalance=totalContract-totalReceived;

  function saveProject(proj){
    setProjects(ps=>proj._new?[...ps,{...proj,_new:undefined,id:uid()}]:ps.map(p=>p.id===proj.id?proj:p));
    setShowForm(false);setEditProj(null);
  }
  function delProject(id){if(window.confirm("Delete this project?"))setProjects(ps=>ps.filter(p=>p.id!==id));}
  function openDoc(proj,type){setDocProj(proj);setDocType(type);setView("doc");setTimeout(()=>window.scrollTo(0,0),50);}

  function onLogo(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      // Compress if too large
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        const max=200;
        let w=img.width,h=img.height;
        if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        const compressed=canvas.toDataURL("image/png",0.8);
        setLogoUrl(compressed);
        saveLogo(compressed);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f);
  }

  const filtered=filter==="all"?projects:projects.filter(p=>p.type===filter);

  const S=(s={})=>({...s});
  const navItems=[
    {id:"dashboard",icon:"⊞",label:"Dashboard"},
    {id:"projects",icon:"☑",label:"Projects"},
    {id:"reminders",icon:"🔔",label:"Reminders",badge:alerts.length},
    {id:"accounts",icon:"📊",label:"Accounts"},
  ];

  return React.createElement("div",{style:{minHeight:"100vh",background:"#f0f2f5"}},

    /* Top bar */
    React.createElement("div",{className:"no-print",style:{background:"#1a1a2e",padding:"14px 16px 0",position:"sticky",top:0,zIndex:50,boxShadow:"0 2px 12px #0008"}},
      React.createElement("div",{style:{maxWidth:740,margin:"0 auto"}},
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:10}},
          React.createElement("div",{onClick:()=>logoRef.current?.click(),style:{width:46,height:46,borderRadius:10,overflow:"hidden",background:logoUrl?"#fff":"#16213e",border:"2px solid #0f3460",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
            logoUrl?React.createElement("img",{src:logoUrl,style:{width:"100%",height:"100%",objectFit:"contain"}}):React.createElement("span",{style:{fontSize:22,opacity:.4}},"🖼")
          ),
          React.createElement("input",{ref:logoRef,type:"file",accept:"image/*",onChange:onLogo,style:{display:"none"}}),
          React.createElement("div",{style:{flex:1}},
            React.createElement("div",{style:{color:"#fff",fontWeight:800,fontSize:17}},OWNER.name+" — Contractor"),
            React.createElement("div",{style:{color:"#718096",fontSize:11}},OWNER.phone)
          ),
          React.createElement("div",{style:{display:"flex",gap:8,alignItems:"center"}},
            React.createElement("button",{onClick:()=>setShowRates(true),style:{padding:"6px 10px",borderRadius:8,border:"1px solid #0f3460",background:"#16213e",color:"#94a3b8",cursor:"pointer",fontSize:11,fontWeight:600}},"⚙️ Rates"),
            React.createElement("div",{style:{textAlign:"right"}},
              React.createElement("div",{style:{color:"#68d391",fontWeight:800,fontSize:13}},Rs(totalReceived)),
              React.createElement("div",{style:{color:"#fc8181",fontSize:10,fontWeight:600}},Rs(totalBalance)+" due")
            )
          )
        ),

function ProjectForm({initial,onSave,onClose}){
  const blank={_new:true,type:"wiring",client:"",clientPhone:"",clientAddress:"",location:"",status:"pending",date:today(),dueDate:"",desc:"",payType:"cash",items:[],shopPurchases:[],received:0,payStatus:"unpaid",invoiceNo:"INV-"+Date.now().toString().slice(-4),reminder:"",reminderNote:""};
  const [form,setForm]=useState(initial?{...initial}:blank);
  const [items,setItems]=useState(initial?[...initial.items]:[]);
  const [shops,setShops]=useState(initial?[...(initial.shopPurchases||[])]: []);
  const [newItem,setNI]=useState({name:"",qty:1,unit:"Nos",rate:""});
  const [newShop,setNS]=useState({shop:"",item:"",qty:1,rate:""});
  const [tab,setTab]=useState("presets");
  const [presetVals,setPV]=useState(()=>{
    const init={};(PRESETS[initial?.type||"wiring"]||[]).forEach(p=>{init[p.id]={qty:"",rate:p.defaultRate};});return init;
  });

  function changeType(t){
    setForm(f=>({...f,type:t}));
    const init={};(PRESETS[t]||[]).forEach(p=>{init[p.id]={qty:"",rate:p.defaultRate};});setPV(init);
  }
  function addPreset(preset){
    const v=presetVals[preset.id]||{};
    const qty=+v.qty;const rate=+v.rate;
    if(!qty||!rate)return;
    const exists=items.find(i=>i.name===preset.name);
    if(exists){setItems(is=>is.map(i=>i.name===preset.name?{...i,qty:i.qty+qty,rate,total:(i.qty+qty)*rate}:i));}
    else{setItems(is=>[...is,{id:uid(),name:preset.name,qty,unit:preset.unit,rate,total:qty*rate}]);}
    setPV(pv=>({...pv,[preset.id]:{...pv[preset.id],qty:""}}));
  }
  function addCustom(){
    if(!newItem.name||!newItem.rate)return;
    setItems(is=>[...is,{...newItem,id:uid(),qty:+newItem.qty,rate:+newItem.rate,total:+newItem.qty*+newItem.rate}]);
    setNI({name:"",qty:1,unit:"Nos",rate:""});
  }
  function addShop(){
    if(!newShop.item||!newShop.rate)return;
    setShops(ss=>[...ss,{...newShop,id:uid(),qty:+newShop.qty,rate:+newShop.rate,total:+newShop.qty*+newShop.rate}]);
    setNS({shop:"",item:"",qty:1,rate:""});
  }

  const itemsTotal=items.reduce((a,i)=>a+i.total,0);
  const shopsTotal=shops.reduce((a,i)=>a+i.total,0);
