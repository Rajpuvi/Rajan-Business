    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;min-height:100vh;}
    input,select,textarea,button{font-family:inherit;}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:#f1f5f9;}
    ::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:2px;}
    @media print{
      @page{size:A4 portrait;margin:10mm 12mm;}
      html,body{margin:0!important;padding:0!important;background:white!important;}
      body>*{display:none!important;}
      #a4print{display:block!important;}
      #a4print{width:100%;font-family:Georgia,serif;font-size:10.5pt;color:#000;background:white;}
      .no-print{display:none!important;}

      .doc-badge{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .doc-table thead tr{background:#1a1a2e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .doc-table tbody tr:nth-child(even){background:#f8f8f8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .doc-total-bar{background:#1a1a2e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .shop-head{background:#ede9fe!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    }
    @media screen{#a4print{display:block;}}
  </style>

const STATUS={
  pending:{label:"Pending",color:"#d97706",bg:"#fffbeb"},
  ongoing:{label:"Ongoing",color:"#2563eb",bg:"#eff6ff"},
  completed:{label:"Completed",color:"#059669",bg:"#f0fdf4"},
  cancelled:{label:"Cancelled",color:"#dc2626",bg:"#fef2f2"},
};

  unpaid:{label:"Unpaid",color:"#dc2626"},
  partial:{label:"Partial",color:"#d97706"},
  paid:{label:"Paid",color:"#059669"},
};
const UNITS=["Nos","Roll","Kg","Ltr","Feet","Meter","Sqft","Work","Day","Box","Set","Pair"];

function uid(){return "X"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();}
function today(){return new Date().toISOString().slice(0,10);}
function fmtD(d){return d?new Date(d).toLocaleDateString("en-GB"):"";}
function Rs(n){return "Rs. "+Number(n||0).toLocaleString("en-IN");}

/* ── localStorage helpers ── */
function loadData(){
  try{
    const d=localStorage.getItem("rajan_projects");
    return d?JSON.parse(d):[];
  }catch{return [];}
}
function saveData(projects){
  try{localStorage.setItem("rajan_projects",JSON.stringify(projects));}catch{}
}
function loadLogo(){
  try{return localStorage.getItem("rajan_logo")||null;}catch{return null;}
}
function saveLogo(url){
  try{
    // Store compressed logo
    if(url && url.length < 500000) localStorage.setItem("rajan_logo",url);
  }catch{}
}

/* ══════════════════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════════════════ */
function App(){
  const [view,setView]=useState("dashboard");
  const [projects,setProjects]=useState(loadData);
  const [filter,setFilter]=useState("all");
  const [showForm,setShowForm]=useState(false);
  const [editProj,setEditProj]=useState(null);
  const [docProj,setDocProj]=useState(null);
  const [docType,setDocType]=useState("quotation");
  const [logoUrl,setLogoUrl]=useState(loadLogo);
  const [showRates,setShowRates]=useState(false);
  const [alerts,setAlerts]=useState([]);
  const logoRef=useRef();

  /* persist projects */
  useEffect(()=>{saveData(projects);},[projects]);

  /* reminders */
  useEffect(()=>{
    const tod=today();
    setAlerts(projects.filter(p=>p.reminder&&p.reminder<=tod&&p.payStatus!=="paid"));
  },[projects]);

  /* render doc to print div */
  useEffect(()=>{
    const el=document.getElementById("a4print");
    if(!el) return;
    if(view==="doc"&&docProj){
      const root2=ReactDOM.createRoot?ReactDOM.createRoot(el):null;
      if(root2) root2.render(React.createElement(A4Doc,{project:docProj,type:docType,logoUrl,owner:OWNER,itemsT,shopT,grandTotal,bal}));
    } else {
      el.innerHTML="";
    }
  },[view,docProj,docType,logoUrl]);

  function itemsT(p){return p.items.reduce((a,i)=>a+i.total,0);}
  function shopT(p){return (p.shopPurchases||[]).reduce((a,i)=>a+i.total,0);}
  function grandTotal(p){return itemsT(p)+shopT(p);}
  function bal(p){return grandTotal(p)-(p.received||0);}

  const totalContract=projects.reduce((s,p)=>s+grandTotal(p),0);
  const totalReceived=projects.reduce((s,p)=>s+(p.received||0),0);
  const totalBalance=totalContract-totalReceived;

  function saveProject(proj){
    setProjects(ps=>proj._new?[...ps,{...proj,_new:undefined,id:uid()}]:ps.map(p=>p.id===proj.id?proj:p));
    setShowForm(false);setEditProj(null);
  }
  function delProject(id){if(window.confirm("Delete this project?"))setProjects(ps=>ps.filter(p=>p.id!==id));}
  function openDoc(proj,type){setDocProj(proj);setDocType(type);setView("doc");setTimeout(()=>window.scrollTo(0,0),50);}

  function onLogo(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      // Compress if too large
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        const max=200;
        let w=img.width,h=img.height;
        if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        const compressed=canvas.toDataURL("image/png",0.8);
        setLogoUrl(compressed);
        saveLogo(compressed);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f);
  }

  const filtered=filter==="all"?projects:projects.filter(p=>p.type===filter);

  const S=(s={})=>({...s});
  const navItems=[
    {id:"dashboard",icon:"⊞",label:"Dashboard"},
    {id:"projects",icon:"☑",label:"Projects"},
    {id:"reminders",icon:"🔔",label:"Reminders",badge:alerts.length},
    {id:"accounts",icon:"📊",label:"Accounts"},
  ];

  return React.createElement("div",{style:{minHeight:"100vh",background:"#f0f2f5"}},

    /* Top bar */

      React.createElement("div",{style:{maxWidth:740,margin:"0 auto"}},
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:10}},

            logoUrl?React.createElement("img",{src:logoUrl,style:{width:"100%",height:"100%",objectFit:"contain"}}):React.createElement("span",{style:{fontSize:22,opacity:.4}},"🖼")

          React.createElement("input",{ref:logoRef,type:"file",accept:"image/*",onChange:onLogo,style:{display:"none"}}),

            React.createElement("div",{style:{color:"#fff",fontWeight:800,fontSize:17}},OWNER.name+" — Contractor"),
            React.createElement("div",{style:{color:"#718096",fontSize:11}},OWNER.phone)

            React.createElement("div",{style:{textAlign:"right"}},
              React.createElement("div",{style:{color:"#68d391",fontWeight:800,fontSize:13}},Rs(totalReceived)),
              React.createElement("div",{style:{color:"#fc8181",fontSize:10,fontWeight:600}},Rs(totalBalance)+" due")
            )
          )
        ),
        !logoUrl&&React.createElement("div",{onClick:()=>logoRef.current?.click(),style:{background:"#16213e",border:"1px dashed #0f3460",borderRadius:8,padding:"5px 12px",marginBottom:8,cursor:"pointer",display:"flex",gap:8,alignItems:"center"}},
          React.createElement("span",null,"🖼"),
          React.createElement("span",{style:{color:"#718096",fontSize:12}},"Logo upload பண்ணு — Quotation & Bill-ல show ஆகும்")
        ),
        React.createElement("div",{style:{display:"flex",gap:4}},
          navItems.map(n=>React.createElement("button",{key:n.id,onClick:()=>setView(n.id),style:{flex:1,padding:"8px 2px 10px",borderRadius:"8px 8px 0 0",border:"none",background:view===n.id?"#f0f2f5":"transparent",color:view===n.id?"#1a1a2e":"#718096",cursor:"pointer",fontSize:11,fontWeight:view===n.id?700:400,position:"relative"}},
            React.createElement("div",{style:{fontSize:15}},n.icon),
            n.label,
            n.badge>0&&React.createElement("span",{style:{position:"absolute",top:4,right:"50%",transform:"translateX(12px)",background:"#dc2626",color:"#fff",borderRadius:10,fontSize:9,fontWeight:700,padding:"1px 5px"}},n.badge)
          ))
        )
      )
    ),

    /* Content */
    React.createElement("div",{className:"no-print",style:{maxWidth:740,margin:"0 auto",padding:"16px"}},

      /* DASHBOARD */
      view==="dashboard"&&React.createElement("div",null,
        alerts.length>0&&React.createElement("div",{style:{background:"#fff5f5",border:"1px solid #fc8181",borderRadius:14,padding:"12px 16px",marginBottom:14}},
          React.createElement("div",{style:{color:"#c53030",fontWeight:700,fontSize:13,marginBottom:8}},"🔔 "+alerts.length+" Reminder Due!"),
          alerts.map(r=>React.createElement("div",{key:r.id,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderTop:"1px solid #fed7d7"}},

              React.createElement("div",{style:{color:"#1a1a2e",fontWeight:600}},r.client),
              React.createElement("div",{style:{color:"#718096",fontSize:12}},(r.reminderNote||"Follow up")+" · "+fmtD(r.reminder))
            ),
            React.createElement("button",{onClick:()=>{setProjects(ps=>ps.map(p=>p.id===r.id?{...p,reminder:""}:p));setAlerts(as=>as.filter(a=>a.id!==r.id));},style:{padding:"4px 10px",borderRadius:8,border:"none",background:"#c53030",color:"#fff",cursor:"pointer",fontSize:12}},"Done")

              React.createElement("div",{style:{fontSize:13,fontWeight:800,color:s.c}},s.v),

        ):React.createElement("div",null,

              ?React.createElement("div",{style:{color:"#059669",textAlign:"center",padding:16}},"எல்லாமே clear! ✅")
              :projects.filter(p=>p.payStatus!=="paid").map(p=>{
                const wt=WORK_TYPES.find(t=>t.id===p.type);
                return React.createElement("div",{key:p.id,style:{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #f0f2f5"}},
                  React.createElement("span",{style:{fontSize:20}},wt?.icon),
                  React.createElement("div",{style:{flex:1}},
                    React.createElement("div",{style:{color:"#1a1a2e",fontWeight:600}},p.client),

                  ),
